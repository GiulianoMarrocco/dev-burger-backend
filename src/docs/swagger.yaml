  - name: Pedidos

    tags:
      - Orders

externalDocs:

  description: Repositório do Projeto DevBurger

  url: https://github.com/GiulianoMarrocco

  x-logo:
  url: https://raw.githubusercontent.com/swagger-api/swagger.io/wordpress/images/assets/SW-logo-clr.png
  altText: DevBurger API

x-api-info:
  project: DevBurger API
  version: 1.0.0
  language: pt-BR

x-notes:
  authentication: |
    Todas as rotas protegidas exigem um JWT válido enviado no header:

      Authorization: Bearer <token>

    O token é obtido através da rota:

      POST /sessions

  uploads: |
    Para upload de imagens utilize:

      Content-Type: multipart/form-data

    Campo esperado:

      file

  permissions: |
    Algumas rotas exigem que o usuário seja administrador.

    Caso contrário a API retornará:

      HTTP 403 Forbidden

  responses: |
    Códigos HTTP utilizados:

      200 - Sucesso

      201 - Recurso criado

      400 - Dados inválidos

      401 - Não autenticado

      403 - Sem permissão

      404 - Recurso não encontrado

      500 - Erro interno do servidor

